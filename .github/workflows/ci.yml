# CI on every push to main and every PR:
#   build       - both production images build (Dockerfiles, frontend bundle)
#   backend-tests - every feature test passes (php artisan test, in-memory SQLite)
#   frontend    - lint and production build of the SPA
#   browser     - optional realtime, role routing, route assignment, kiosk and face models
#   migrations  - every migration runs cleanly on a fresh MySQL 8.4, the same
#                 engine as production, then concurrent writes and backup restore
# Deployment is separate: the hosting platform auto-deploys main on push.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: at-ice-backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: at-ice-frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: at-ice-backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, bcmath, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check Composer security advisories
        run: composer audit --locked --no-interaction

      - name: Run the feature tests (in-memory SQLite)
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: at-ice-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: at-ice-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Check npm security advisories
        run: npm audit
      - run: npm run lint
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ATICE_TEST_ROOT: /tmp/atice-browser-test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, bcmath, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: at-ice-frontend/package-lock.json
      - run: composer install --no-interaction --no-progress --prefer-dist
        working-directory: at-ice-backend
      - run: php tests/Support/seed_browser_smoke.php
        working-directory: at-ice-backend
      - run: npm ci --no-audit --no-fund
        working-directory: at-ice-frontend
      - run: npx playwright install --with-deps chromium
        working-directory: at-ice-frontend
      - run: npm run test:browser
        working-directory: at-ice-frontend
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-regression-report
          path: /tmp/atice-browser-test/report
          retention-days: 7

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: atice_test
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: at-ice-backend
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: atice_test
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, bcmath
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run all migrations on an empty MySQL database
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force

      - name: Verify parallel attendance and payroll writes on MySQL
        run: php artisan test --filter=ConcurrentWritesMysqlTest

      - name: Prove backup restore into a new test database
        env:
          ATICE_BACKUP_TEST_ROOT: ${{ runner.temp }}/atice-backup-drill
        run: php tests/Support/backup_restore_drill.php

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: synthetic-restore-evidence
          path: ${{ runner.temp }}/atice-backup-drill/restore-evidence.json
          retention-days: 7
