# AT Ice — production Docker Compose stack.
# Only `frontend` is public: https://www.atice.cloud (canonical) and
# https://atice.cloud (nginx 301s it to www). It serves the SPA and
# forwards /api to `backend` over the internal network; backend, worker
# and mysql are never exposed. Values come from the server's environment
# variables — see .env.production.example for the full list.

services:
  frontend:
    build:
      context: ./at-ice-frontend
      args:
        VITE_PUSHER_APP_KEY: ${PUSHER_APP_KEY}
        VITE_PUSHER_APP_CLUSTER: ${PUSHER_APP_CLUSTER:-ap1}
        VITE_BACKEND_URL: ${APP_URL:-https://www.atice.cloud}
    volumes:
      - public-storage:/srv/storage:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./at-ice-backend
    environment: &laravel-env
      APP_NAME: "AT Ice"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-https://www.atice.cloud}
      # Philippine time for dates, month grouping and receipt numbers.
      # PH has no DST, so the fixed DB offset always matches.
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Manila}
      DB_TIMEZONE: ${DB_TIMEZONE:-+08:00}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-atice}
      DB_USERNAME: ${DB_USERNAME:-atice}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "true"
      # Cache, rate limits and the scheduler's locks live in the redis service
      # below (shared by backend, worker and scheduler). The database store hit
      # deadlocks on the rate limiter's insert-ignore under load. Set the
      # CACHE_STORE variable to "database" to go back without a code change.
      CACHE_STORE: ${CACHE_STORE:-redis}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-pusher}
      PUSHER_APP_ID: ${PUSHER_APP_ID}
      PUSHER_APP_KEY: ${PUSHER_APP_KEY}
      PUSHER_APP_SECRET: ${PUSHER_APP_SECRET}
      PUSHER_APP_CLUSTER: ${PUSHER_APP_CLUSTER:-ap1}
      CORS_ALLOWED_ORIGINS: ${APP_URL:-https://www.atice.cloud}
      # Android app (see DEPLOY.md, "Android app"). APP_CLIENT_KEY must be the
      # same value the APK was built with (VITE_APP_CLIENT_KEY); empty means no
      # app session is accepted. The Firebase service account file lives in the
      # private-storage volume, so a redeploy keeps it.
      APP_CLIENT_KEY: ${APP_CLIENT_KEY:-}
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-/var/www/html/storage/app/private/firebase-service-account.json}
      # How long a website sign-in lasts, and the idle limit per role (minutes).
      # The Android app has neither limit.
      WEB_TOKEN_HOURS: ${WEB_TOKEN_HOURS:-12}
      IDLE_MINUTES_ADMIN: ${IDLE_MINUTES_ADMIN:-30}
      IDLE_MINUTES_HR: ${IDLE_MINUTES_HR:-30}
      IDLE_MINUTES_CUSTOMER: ${IDLE_MINUTES_CUSTOMER:-30}
      GROQ_API_KEY: ${GROQ_API_KEY}
      # Customer login emails and "Forgot password?" codes. "log" (default)
      # only writes them to the log; set the SMTP values to really send.
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@atice.cloud}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-AT Ice}
      EMAIL_VERIFY_API_KEY: ${EMAIL_VERIFY_API_KEY:-}
      RUN_MIGRATIONS: "true"
    volumes:
      - public-storage:/var/www/html/storage/app/public
      # Private files that nginx must never serve (face pictures, applicants' resumes). Back it up too.
      - private-storage:/var/www/html/storage/app/private
      # AT-ICE.apk and app-version.json (made by `npm run apk:live`, never in git).
      # The API serves the file at /api/app-download; the volume keeps it across redeploys.
      - app-downloads:/var/www/html/public/downloads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  worker:
    build: ./at-ice-backend
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=5", "--sleep=3", "--max-time=3600"]
    environment:
      <<: *laravel-env
      RUN_MIGRATIONS: "false"
    volumes:
      # Phone notices are sent from here too, so it needs the Firebase file.
      - private-storage:/var/www/html/storage/app/private
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Time-based jobs every minute (routes/console.php): driver reassignment and
  # delay notices, missed-Time-Out memos, payroll cut-off notice, archive expiry.
  scheduler:
    build: ./at-ice-backend
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *laravel-env
      RUN_MIGRATIONS: "false"
    volumes:
      # Delay notices go out as phone notices from here, and archive expiry
      # deletes private files, so it needs the same private storage.
      - private-storage:/var/www/html/storage/app/private
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-atice}
      MYSQL_USER: ${DB_USERNAME:-atice}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      # Nightly mysqldump output (scheduled task, see DEPLOY.md)
      - mysql-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # Cache only (rate limits, locks, cached settings): internal network, no
  # port published, nothing written to disk. Losing it only clears the cache.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  public-storage:
  private-storage:
  app-downloads:
  mysql-data:
  mysql-backups:
